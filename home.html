        * {

        /* Hero Section */

            align-items: center;
            text-align: center;

            font-weight: bold;
            color: #fff;

        }

        .hero p {
            font-size: 1.5rem;
            color: #fff;
            margin-top: 10px;
        }

            padding: 10px 20px;
            background-color: #e50914;
            border: none;
            font-size: 1.2rem;
            color: #fff;
            cursor: pointer;
            text-transform: uppercase;
            transition: background-color 0.3s;
        }

        .cta-btn:hover {
            background-color: #b81d10;
        }

        /* Featured Tracks Section */
        .featured-tracks {
            display: flex;
            justify-content: space-around;
            padding: 50px 0;
            background-color: #1e1e1e;
        }

        .track {
            text-align: center;
        }

        .track img {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
        }

        .track h3 {
            margin-top: 10px;
        }

        .track button {
            margin-top: 10px;
            padding: 10px 15px;
            background-color: #e50914;
            border: none;
            color: #fff;
            cursor: pointer;
        }

        /* Upcoming Section */
        .upcoming {
            background-color: #222;
            padding: 50px 0;
            text-align: center;
        }
